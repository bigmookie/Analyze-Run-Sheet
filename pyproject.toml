[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "run_sheet_analyzer"
version = "0.1.0"
description = "Analyze a real-estate run sheet and produce a draft Mississippi title report."
requires-python = ">=3.10"
# Runtime dependencies live in requirements.txt (single source of truth).
# Install with: pip install -r requirements.txt
# Then install this package itself with: pip install -e .

[project.scripts]
analyze-run-sheet = "run_sheet_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"run_sheet_analyzer" = ["prompts/*.md"]
