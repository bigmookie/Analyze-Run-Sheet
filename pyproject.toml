[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "run_sheet_analyzer"
version = "0.1.0"
description = "Analyze a real-estate run sheet and produce a draft Mississippi title report."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "docxtpl>=0.16",
    "numpy>=1.24",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # doc_embed is installed separately:
    #   pip install -e "C:\Users\gardn\Documents\Projects\Embeddings DB Creator"
]

[project.scripts]
analyze-run-sheet = "run_sheet_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"run_sheet_analyzer" = ["prompts/*.md"]
